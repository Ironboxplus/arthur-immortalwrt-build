name: Build Arthur
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: arthur-${{ github.ref }}
  cancel-in-progress: false
jobs:
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      TZ: Asia/Singapore
      CCACHE_DIR: /home/runner/.cache/arthur-ccache
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Inspect runner disk
        run: |
          test "$GITHUB_ACTIONS" = true
          date -Is
          df -h
          nproc
          free -h
      - name: Free runner disk with bounded cleanup
        timeout-minutes: 4
        run: |
          for path in /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL; do
            echo "[$(date -Is)] Removing optional runner tools: $path"
            timeout 40s sudo rm -rf "$path" || echo "Cleanup timed out for $path; continuing"
          done
          df -h
      - name: Select a responsive Ubuntu mirror
        timeout-minutes: 2
        run: |
          best_url='https://archive.ubuntu.com/ubuntu'
          best_speed=0
          for base in https://archive.ubuntu.com/ubuntu https://azure.archive.ubuntu.com/ubuntu http://azure.archive.ubuntu.com/ubuntu; do
            result=$(curl -L -s --connect-timeout 5 --max-time 15 -o /tmp/arthur-ubuntu-release -w '%{http_code} %{speed_download}' "$base/dists/noble-updates/Release" || true)
            echo "Ubuntu mirror probe: $base -> $result bytes/sec"
            read -r code speed <<< "$result"
            speed=${speed%%.*}
            if [[ "$code" = 200 && "${speed:-0}" -gt "$best_speed" ]]; then
              best_url=$base
              best_speed=$speed
            fi
          done
          echo "Selected Ubuntu mirror: $best_url"
          sudo python3 - "$best_url" <<'PY'
          from pathlib import Path
          import sys
          base = sys.argv[1]
          paths = [Path('/etc/apt/sources.list'), *Path('/etc/apt/sources.list.d').glob('*.sources'), *Path('/etc/apt/sources.list.d').glob('*.list')]
          for path in paths:
              if not path.exists():
                  continue
              text = path.read_text()
              for old in ['http://azure.archive.ubuntu.com/ubuntu', 'https://azure.archive.ubuntu.com/ubuntu', 'http://archive.ubuntu.com/ubuntu', 'https://archive.ubuntu.com/ubuntu']:
                  text = text.replace(old, base)
              path.write_text(text)
          PY
      - name: Update apt package indexes
        timeout-minutes: 4
        run: |
          date -Is
          timeout 180s sudo apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
      - name: Install build dependencies
        timeout-minutes: 8
        run: |
          date -Is
          timeout 420s sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Dpkg::Use-Pty=0 install --no-install-recommends -y build-essential clang flex bison g++ gawk gcc-multilib gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            xsltproc libelf-dev device-tree-compiler zstd ccache ninja-build pkgconf texinfo libtool-bin \
            libzstd-dev gperf libfuse-dev
          df -h
      - name: Restore source download and compiler caches
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            source/dl
            /home/runner/.cache/arthur-ccache
          key: arthur-6.12-${{ runner.os }}-${{ hashFiles('source.lock.json', 'feeds.lock.json', 'config.seed') }}
          restore-keys: arthur-6.12-${{ runner.os }}-
      - name: Lock source, configure feeds and verify required software
        run: bash scripts/prepare.sh
      - name: Download source archives
        working-directory: source
        run: |
          set -o pipefail
          make download -j8 V=s 2>&1 | tee ../artifacts/download.log
      - name: Compile Arthur firmware
        working-directory: source
        run: |
          set -o pipefail
          make -j"$(nproc)" V=s 2>&1 | tee ../artifacts/build.log || \
            make -j1 V=s 2>&1 | tee ../artifacts/build-serial.log
      - name: Audit manifest and image partition sizes
        run: python3 scripts/verify.py images "$GITHUB_WORKSPACE"
      - name: Archive matching kernel modules and packages
        run: tar -I 'zstd -T0 -3' -cf artifacts/matching-packages.tar.zst -C source/bin packages targets/qualcommax/ipq60xx/packages
      - name: Save diagnostics even on failure
        if: always()
        run: |
          mkdir -p artifacts
          test ! -f source/.config || cp source/.config artifacts/config.resolved
          test ! -d source/logs || tar -czf artifacts/openwrt-logs.tar.gz -C source logs
          df -h > artifacts/runner-disk.txt
      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: arthur-${{ github.run_number }}-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
